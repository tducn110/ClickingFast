
  <!DOCTYPE html>
  <html lang="en">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Peanut Tribe — Mini Game</title>
      <meta name="description" content="Hành trình ngược về tuổi thơ — Game giải trí lấy cảm hứng từ làng quê Việt Nam" />
      <meta name="robots" content="noindex, nofollow" />
      <link rel="icon" type="image/webp" href="/assets/fruits/apple.webp" />
      <style>
        html, body, #root {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          overscroll-behavior: none;
        }
      
      /* ==========================================================================
         PAPA STUDIO MINIMALIST LOADING SCREEN (White + Black Logo + Progress Bar)
         ========================================================================== */
      #papa-loading-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        z-index: 99999;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s ease;
      }

      #papa-loading-screen.papa-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .papa-loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 260px;
      }

      .papa-loading-logo {
        width: 180px;
        max-width: 58vw;
        height: auto;
        object-fit: contain;
        display: block;
        margin-bottom: 24px;
        user-select: none;
        -webkit-user-select: none;
      }

      .papa-loading-track {
        width: 160px;
        max-width: 50vw;
        height: 4px;
        background: #f0f0f0;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .papa-loading-bar {
        width: 0%;
        height: 100%;
        background: #000000;
        border-radius: 9999px;
        transition: width 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
    </style>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="preload" href="/audio/BGMM_Lofi1.mp3" as="audio" type="audio/mpeg">
</head>

    <body>

              <!-- PAPA STUDIO LOADING SCREEN (Instant Display) -->
    <div id="papa-loading-screen" aria-live="polite" role="status">
      <div class="papa-loading-content">
        <img
          class="papa-loading-logo"
          src="/assets/brand/PapaStudio_Logo_Full_Black.png"
          alt="PapaStudio"
        />
        <div class="papa-loading-track">
          <div class="papa-loading-bar" id="papaProgressBarFill"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
      <script src="https://sdk.winkgames.fun/v1/wink.js"></script>
      <script type="module" src="/src/main.tsx"></script>

    <!-- PAPA LOADING RUNTIME CONTROLLER -->
    <script>
      (function() {
        const screenEl = document.getElementById('papa-loading-screen');
        const progressBarFill = document.getElementById('papaProgressBarFill');

        let currentProgress = 0;
        let targetProgress = 0;
        let isDone = false;
        let isDismissed = false;

        function updateProgressVisual(pct) {
          const rounded = Math.min(100, Math.floor(pct));
          if (progressBarFill) {
            progressBarFill.style.width = rounded + '%';
          }

          if (rounded >= 100 && !isDone) {
            isDone = true;
            setTimeout(function() {
              dismissScreen();
            }, 200);
          }
        }

        const tickTimer = setInterval(function() {
          if (isDone) return;
          const stepSpeed = targetProgress >= 100 ? 0.45 : 0.25;
          currentProgress += (targetProgress - currentProgress) * stepSpeed;
          if (targetProgress >= 100 && currentProgress >= 98.5) {
            currentProgress = 100;
          }
          updateProgressVisual(currentProgress);
        }, 35);

        function dismissScreen() {
          if (isDismissed) return;
          isDismissed = true;
          clearInterval(tickTimer);

          window.dispatchEvent(new CustomEvent('papa-loading-dismiss'));

          if (screenEl) {
            screenEl.classList.add('papa-hidden');
            setTimeout(function() {
              if (screenEl.parentNode) {
                screenEl.parentNode.removeChild(screenEl);
              }
            }, 360);
          }
        }

        // Imperative dismiss hook for game-loader
        window.__PAPA_DISMISS_LOADING__ = dismissScreen;

        // Global API for React App
        window.PapaLoading = {
          setProgress: function(pct) {
            targetProgress = Math.max(targetProgress, Math.min(99, pct));
          },
          complete: function() {
            targetProgress = 100;
            currentProgress = 100;
            updateProgressVisual(100);
          },
          dismiss: dismissScreen,
          isComplete: function() {
            return isDone;
          }
        };
      })();
    </script>

    
</body>
  </html>
