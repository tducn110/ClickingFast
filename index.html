      <style>
        html, body, #root {

:root {
        --papa-bg-primary: #070709;
        --papa-surface-glass: rgba(255, 255, 255, 0.04);
        --papa-border-glass: rgba(255, 255, 255, 0.1);

/* ==========================================================================
         PAPA STUDIO LUXURY MOBILE LOADING SCREEN
         ========================================================================== */
      #papa-loading-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background-color: var(--papa-bg-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 24px) + 16px) 24px calc(env(safe-area-inset-bottom, 24px) + 24px) 24px;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        z-index: 99999;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
        font-family: var(--papa-font-main);
        color: var(--papa-text-primary);
      }

      #papa-loading-screen.papa-hidden {
        opacity: 0;
        transform: scale(1.02);
        visibility: hidden;
        pointer-events: none;
      }

      /* Ambient Visual Layers */
      .papa-ambient-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .papa-ambient-glow-1 {
        position: absolute;
        width: 320px;
        height: 320px;
        top: 25%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, var(--papa-accent-glow) 0%, rgba(99, 102, 241, 0) 70%);
        border-radius: 50%;
        filter: blur(50px);
        z-index: 1;
        opacity: 0.8;
        animation: papaPulseGlow 5s ease-in-out infinite alternate;
        pointer-events: none;
      }

      .papa-ambient-glow-2 {
        position: absolute;
        width: 260px;
        height: 260px;
        bottom: 25%;
        left: 50%;
        transform: translate(-50%, 50%);
        background: radial-gradient(circle, var(--papa-accent-glow-secondary) 0%, rgba(236, 72, 153, 0) 70%);
        border-radius: 50%;
        filter: blur(60px);
        z-index: 1;
        opacity: 0.6;
        animation: papaPulseGlow 6s ease-in-out infinite alternate-reverse;
        pointer-events: none;
      }

      @keyframes papaPulseGlow {
        0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
        100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
      }

      /* Top Header */
      .papa-screen-header {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 380px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .papa-pill-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        background: var(--papa-surface-glass);
        border: 1px solid var(--papa-border-glass);
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--papa-text-secondary);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .papa-pill-badge .papa-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: papaLivePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes papaLivePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .papa-sound-toggle-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--papa-surface-glass);
        border: 1px solid var(--papa-border-glass);

        align-items: center;
        justify-content: center;

      .papa-sound-toggle-btn:active {

      /* Hero Center */
      .papa-hero-center {

      .papa-logo-inner-core {
        position: relative;

      .papa-progress-track-wrapper {
        position: relative;

      .papa-cta-enter-btn {

    <!-- PAPA LOADING RUNTIME CONTROLLER -->
    <script>
      (function() {
        const isVi = (function() {
          try {
            return window.localStorage.getItem('fruit-slashing-language') === 'vi';
          } catch(e) {
            return false;
          }
        })();

        const stages = isVi ? [
          { at: 20, label: "Khởi tạo tài nguyên...", tip: "Đang nạp cấu trúc game engine..." },
          { at: 60, label: "Tải âm thanh & đồ họa...", tip: "Tối ưu hóa bộ nhớ đồ họa và font chữ..." },
          { at: 90, label: "Đồng bộ hóa hệ thống...", tip: "Chuẩn bị màn chơi đầu tiên..." },
          { at: 100, label: "Sẵn sàng!", tip: "Trải nghiệm bắt đầu ngay bây giờ" }
        ] : [
          { at: 20, label: "Initializing resources...", tip: "Setting up game engine..." },
          { at: 60, label: "Loading audio & visuals...", tip: "Optimizing textures and fonts..." },
          { at: 90, label: "Synchronizing system...", tip: "Preparing first scene..." },
          { at: 100, label: "Ready!", tip: "Experience starting now" }
        ];

        // Zero-asset procedural Web Audio synthesizer
        class HapticAudio {
          constructor() {
            this.ctx = null;
            this.enabled = true;
          }
          init() {
            if (!this.ctx) {
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              if (AudioContext) {
                this.ctx = new AudioContext();
              }
            }
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume().catch(function() {});
            }
          }
          playBlip(freq, duration) {
            if (!this.enabled) return;
            try {
              this.init();
              if (!this.ctx) return;
              const f = freq || 440;
              const d = duration || 0.04;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, this.ctx.currentTime);
              gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + d);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + d);
            } catch(e) {}
          }
          playSuccessChord() {
            if (!this.enabled) return;
            try {
              this.init();
              if (!this.ctx) return;
              const self = this;
              const chordFreqs = [523.25, 659.25, 783.99, 1046.50];
              chordFreqs.forEach(function(freq, idx) {
                const osc = self.ctx.createOscillator();
                const gain = self.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, self.ctx.currentTime + (idx * 0.05));
                gain.gain.setValueAtTime(0.06, self.ctx.currentTime + (idx * 0.05));
                gain.gain.exponentialRampToValueAtTime(0.0001, self.ctx.currentTime + 0.9);
                osc.connect(gain);
                gain.connect(self.ctx.destination);
                osc.start(self.ctx.currentTime + (idx * 0.05));
                osc.stop(self.ctx.currentTime + 0.95);
              });
            } catch(e) {}
          }
          close() {
            if (this.ctx) {
              try { this.ctx.close(); } catch(e) {}
              this.ctx = null;
            }
          }
        }

        const soundSystem = new HapticAudio();

        // Particles
        const canvas = document.getElementById('papaParticleCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let particles = [];
        let animationFrameId = null;

        function resizeCanvas() {
          const container = document.getElementById('papa-loading-screen');
          if (container && canvas) {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
          }
        }

        function Particle(w, h) {
          this.reset(w, h);
        }
        Particle.prototype.reset = function(w, h) {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.radius = Math.random() * 1.5 + 0.4;
          this.alpha = Math.random() * 0.5 + 0.15;
          this.speedX = (Math.random() - 0.5) * 0.3;
          this.speedY = -Math.random() * 0.4 - 0.1;
        };
        Particle.prototype.update = function(w, h) {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.y < 0 || this.x < 0 || this.x > w) {
            this.reset(w, h);
            this.y = h;
          }
        };
        Particle.prototype.draw = function(c) {
          c.beginPath();
          c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          c.fillStyle = 'rgba(255, 255, 255, ' + this.alpha + ')';
          c.fill();
        };

        function initParticles() {
          if (!canvas || !ctx) return;
          resizeCanvas();
          particles = [];
          const count = Math.min(Math.floor((canvas.width * canvas.height) / 11000), 36);
          for (let i = 0; i < count; i++) {
            particles.push(new Particle(canvas.width, canvas.height));
          }
        }

        function animateParticles() {
          if (!ctx || !canvas) return;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < particles.length; i++) {
            particles[i].update(canvas.width, canvas.height);
            particles[i].draw(ctx);
          }
          animationFrameId = requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);

        // Progress elements
        const screenEl = document.getElementById('papa-loading-screen');
        const progressBarFill = document.getElementById('papaProgressBarFill');
        const percentageText = document.getElementById('papaPercentageText');
        const statusLabel = document.getElementById('papaStatusLabel');
        const loadingTip = document.getElementById('papaLoadingTip');
        const statusSpinner = document.getElementById('papaStatusSpinner');
        const ctaEnterBtn = document.getElementById('papaCtaEnterBtn');
        const ctaText = document.getElementById('papaCtaText');
        const soundBtn = document.getElementById('papaSoundBtn');
        const soundOnIcon = document.getElementById('papaSoundOnIcon');
        const soundOffIcon = document.getElementById('papaSoundOffIcon');

        if (ctaText) {
          ctaText.textContent = isVi ? "BẮT ĐẦU TRẢI NGHIỆM" : "START EXPERIENCE";
        }

        let currentProgress = 0;
        let targetProgress = 0;
        let isDone = false;
        let isDismissed = false;

        function updateProgressVisual(pct) {
          const rounded = Math.min(100, Math.floor(pct));
          if (percentageText) percentageText.textContent = rounded + '%';
          if (progressBarFill) progressBarFill.style.width = rounded + '%';

          for (let i = stages.length - 1; i >= 0; i--) {
            if (rounded >= stages[i].at) {
              if (statusLabel && statusLabel.textContent !== stages[i].label) {
                statusLabel.textContent = stages[i].label;
                if (loadingTip) loadingTip.textContent = stages[i].tip;
                soundSystem.playBlip(550 + rounded * 3, 0.03);
              }
              break;
            }
          }

          if (rounded >= 100 && !isDone) {
            isDone = true;
            if (statusSpinner) statusSpinner.style.display = 'none';
            if (statusLabel) statusLabel.textContent = isVi ? "Sẵn sàng!" : "Ready!";
            if (loadingTip) {
              loadingTip.textContent = isVi ? "Trải nghiệm bắt đầu ngay bây giờ" : "Experience starting now";
            }
            soundSystem.playSuccessChord();

            // Hold 200ms visual polish then fade out (Contract S6)
            setTimeout(function() {
              dismissScreen();
            }, 200);
          }
        }

        // Smooth tick loop
        let tickTimer = setInterval(function() {
          if (isDone) return;
          const stepSpeed = targetProgress >= 100 ? 0.45 : 0.25;
          currentProgress += (targetProgress - currentProgress) * stepSpeed;
          if (targetProgress >= 100 && currentProgress >= 98.5) {
            currentProgress = 100;
          }
          updateProgressVisual(currentProgress);
        }, 35);

        function dismissScreen() {
          if (isDismissed) return;
          isDismissed = true;
          clearInterval(tickTimer);

          window.dispatchEvent(new CustomEvent('papa-loading-dismiss'));

          if (screenEl) {
            screenEl.classList.add('papa-hidden');
            setTimeout(function() {
              if (animationFrameId) cancelAnimationFrame(animationFrameId);
              soundSystem.close();
              if (screenEl.parentNode) screenEl.parentNode.removeChild(screenEl);
            }, 460);
          }
        }

        if (screenEl) {
          screenEl.addEventListener('click', function() {
            if (isDone) dismissScreen();
          });
        }

        if (ctaEnterBtn) {
          ctaEnterBtn.addEventListener('click', dismissScreen);
        }

        if (soundBtn) {
          soundBtn.addEventListener('click', function() {
            soundSystem.enabled = !soundSystem.enabled;
            if (soundSystem.enabled) {
              soundOnIcon.style.display = 'block';
              soundOffIcon.style.display = 'none';
              soundSystem.playBlip(800, 0.05);
            } else {
              soundOnIcon.style.display = 'none';
              soundOffIcon.style.display = 'block';
            }
          });
        }

        // Global API for React App
        window.PapaLoading = {
          setProgress: function(pct, label, tip) {
            targetProgress = Math.max(targetProgress, Math.min(99, pct));
            if (label && statusLabel) statusLabel.textContent = label;
            if (tip && loadingTip) loadingTip.textContent = tip;
          },
          complete: function() {
            targetProgress = 100;
            currentProgress = 100;
            updateProgressVisual(100);
          },
          dismiss: dismissScreen,
          isComplete: function() {
            return isDone;
          }
        };

        // Initialize particles immediately
        initParticles();
        animateParticles();
      })();
    </script>

    
</body>
